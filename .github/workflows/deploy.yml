name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check publication metadata
        run: |
          python3 tools/generate_publications_data.py
          git diff --exit-code -- _data/publications.json _data/publication_topics.json
          python3 -m unittest discover -s tools -p test_generate_publications_data.py -v
      - name: Check source upload boundaries
        run: python3 tools/check_publish_files.py
      - name: Build website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Check public artifact
        run: python3 tools/check_publish_files.py --site _site
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
